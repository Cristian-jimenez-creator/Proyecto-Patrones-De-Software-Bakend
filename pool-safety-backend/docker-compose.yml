# Base de datos local de desarrollo. Lee las variables desde el archivo .env
services:
  postgres:
    image: postgres:16-alpine
    container_name: poolsafety-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-poolsafety}
      POSTGRES_USER: ${DB_USER:-poolsafety}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      TZ: UTC
      PGTZ: UTC
    # Solo accesible desde la maquina local
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - poolsafety-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-poolsafety} -d ${DB_NAME:-poolsafety}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  poolsafety-pgdata:
